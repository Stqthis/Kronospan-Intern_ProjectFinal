# Full local stack: Ollama (models) + Jarvisman (API + CLI).
#
# Copy .env.example to .env first, then:
#
#   docker compose up -d ollama api          # the persistent stack
#   docker compose run --rm cli index /files # index mounted files
#   docker compose run --rm cli ask "your question"
#
# The desktop GUI runs NATIVELY on the workstation, not in a container:
#   RAG_BACKEND_URL=http://<dgx-host>:8800 python app.py
#
# Put your PDFs/Excels under ./files (or set FILES_DIR in .env).

x-jarvis-env: &jarvis-env
  OLLAMA_HOST: http://ollama:11434
  RAG_DATA_DIR: /data
  RAG_API_KEY: ${RAG_API_KEY:-}
  RAG_CHAT_MODEL: ${RAG_CHAT_MODEL:-qwen2.5-coder:32b}
  RAG_CODE_MODEL: ${RAG_CODE_MODEL:-}
  RAG_UNDERSTANDING_MODEL: ${RAG_UNDERSTANDING_MODEL:-}
  RAG_KEEP_ALIVE: ${RAG_KEEP_ALIVE:--1}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    logging: *default-logging
    # Bound to localhost by default: the model server has no authentication
    # of its own, so it must not be reachable from the wider network. Set
    # OLLAMA_BIND=0.0.0.0 in .env only on a trusted, firewalled subnet.
    ports:
      - "${OLLAMA_BIND:-127.0.0.1}:11434:11434"
    volumes:
      - ${OLLAMA_MODELS_DIR:-ollama_models}:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      # --- Speed-only settings: none of these change model weights, sampling,
      # or output tokens, so answer quality/accuracy is unaffected. ---
      #
      # Keep BOTH routed models resident at once (qwen2.5-coder:32b for
      # plan/codegen, llama3:70b for understanding/synthesis). Without this,
      # Ollama's cache can evict one model to load the other on every
      # alternating call, turning a normal query into two full model loads.
      # The Spark's unified memory has room for both simultaneously.
      OLLAMA_MAX_LOADED_MODELS: "2"
      # Never idle-unload (mirrors the app's own KEEP_ALIVE=-1, but this
      # covers warmup/list calls and any other client hitting this server).
      OLLAMA_KEEP_ALIVE: "-1"
      # Mathematically equivalent attention computation, just faster and
      # lighter on VRAM/unified-memory pressure -- no effect on output.
      OLLAMA_FLASH_ATTENTION: "1"
      # This app is single-user/sequential (one desktop GUI, one query at a
      # time) -- serving multiple parallel request slots per model just
      # reserves extra KV-cache memory nobody uses. Freeing that memory lets
      # the model use a bigger/faster KV cache for the one real request.
      OLLAMA_NUM_PARALLEL: "1"
    # NVIDIA GPU passthrough -- requires the nvidia-container-toolkit
    # installed on the host (DGX Spark: `sudo apt install
    # nvidia-container-toolkit && sudo nvidia-ctk runtime configure
    # --runtime=docker && sudo systemctl restart docker`). Without this the
    # container falls back to CPU, which is dramatically slower for both
    # models.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Persistent backend API: the WHOLE pipeline (agent + index + model access)
  # served over JSON. The desktop app connects as a thin client with
  #   RAG_BACKEND_URL=http://<host>:8800 python app.py
  api:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: jarvisman:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["python", "-m", "jarvisman.server"]
    restart: unless-stopped
    logging: *default-logging
    # Also localhost-only unless RAG_API_KEY is set and you deliberately
    # widen it: /ask executes model-generated pandas over company data.
    ports:
      - "${API_BIND:-127.0.0.1}:8800:8800"
    environment:
      <<: *jarvis-env
      RAG_API_PORT: "8800"
    volumes:
      - jarvis_index:/data
      - ${FILES_DIR:-./files}:/files:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8800/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  # One-shot CLI runs (indexing, ad-hoc questions, the offline check suite).
  # Shares the SAME index volume as the API, so anything indexed here is
  # served by the API immediately -- no re-indexing.
  cli:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: jarvisman:latest
    profiles: ["tools"]        # never started by `up`; use `run --rm cli ...`
    depends_on:
      ollama:
        condition: service_healthy
    environment: *jarvis-env
    volumes:
      - jarvis_index:/data
      - ${FILES_DIR:-./files}:/files:ro
    security_opt:
      - no-new-privileges:true

volumes:
  jarvis_index:
    name: jarvis_index
    external: true
  ollama_models:
    name: ollama_models