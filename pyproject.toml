[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvisman"
version = "0.1.0"
description = "Offline local RAG assistant over Kronospan financial spreadsheets"
requires-python = ">=3.10"
dependencies = [
    "PyQt6",
    "faiss-cpu>=1.7.4",
    "PyMuPDF>=1.23.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
# after `pip install -e .` you can launch with the `jarvisman` command
jarvisman = "jarvisman.ui.gui:main"

[tool.setuptools.packages.find]
include = ["jarvisman*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
